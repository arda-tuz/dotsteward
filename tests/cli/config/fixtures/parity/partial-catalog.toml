# Valid with every catalog variant of the parity test: names outside the
# canonical catalog order sort after it.
schema_version = 1

[identity]
username = "alice"

[instance]
name = "partial"
remote = "git@github.com:alice/workstation.git"

[nix]
state_version = "26.05"

[profiles]
names = ["main"]

[components]
order = ["example-term"]

[components.example-term]
enable = true
method = "nix"

[components.herdr]
enable = true
