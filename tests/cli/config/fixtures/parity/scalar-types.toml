# Booleans are not integers, floats are not integers, bounds and enums.
schema_version = 1

[identity]
username = "alice"

[instance]
remote = "git@github.com:alice/workstation.git"
branch = ""

[nix]
systems = ["x86_64-linux", "x86_64-linux", "riscv64-linux"]
allow_unfree = 1
state_version = "26.05"

[profiles]
names = ["main"]

[gate]
nix_max_jobs = true
nix_cores = -1
min_free_gib = 1.0
prepare_warn_free_gib = 0
cache_url = "ftp://cache.example.invalid"

[upstream]
contribute = "mirror"
pr_to_upstream = "yes"
