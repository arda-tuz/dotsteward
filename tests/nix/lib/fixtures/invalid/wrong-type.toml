upstream = "fork"
schema_version = 1

[identity]
username = "alice"

[instance]
remote = "git@github.com:alice/workstation.git"

[nix]
state_version = "26.05"
allow_unfree = "yes"

[profiles]
names = ["main"]

[gate]
nix_max_jobs = 1.5

[privacy]
forbidden_paths = "*secret*"
