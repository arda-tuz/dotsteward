# Failure case: a method asked for darwin explicitly, for a component that supports Linux only.
schema_version = 1

[identity]
username = "alice"

[instance]
remote = "git@github.com:alice/workstation.git"

[nix]
systems = ["x86_64-linux", "aarch64-darwin"]
state_version = "25.11"

[profiles]
names = ["workstation"]

[components.example-linux]
enable = true
method_by_platform = { darwin = "external" }
