# Method precedence: method_by_platform over method.
schema_version = 1

[identity]
username = "alice"

[instance]
remote = "git@github.com:alice/workstation.git"

[nix]
systems = ["x86_64-linux", "aarch64-darwin"]
state_version = "25.11"

[profiles]
names = ["workstation"]

[components.example-app]
enable = true

[components.example-term]
enable = true
method = "nix"
method_by_platform = { linux = "official-binary" }
