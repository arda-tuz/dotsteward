# The components `dotsteward add --apt` and `dotsteward add --nix` write (tests/track compares
# their text with these files byte for byte): both evaluate, the deb one on Linux only.
schema_version = 1

[identity]
username = "alice"

[instance]
remote = "git@github.com:alice/workstation.git"

[nix]
systems = ["x86_64-linux", "aarch64-darwin"]
state_version = "25.11"

[profiles]
names = ["workstation"]

[components.example-notes]
enable = true

[components.example-grep]
enable = true
