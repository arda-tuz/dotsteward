# Two profiles, synthetic instance components, a custom state root, a
# non-default skills root and agent rules source, and the legacy environment.
schema_version = 1

[identity]
username = "alice"

[instance]
remote = "git@github.com:alice/workstation.git"

[state]
root = "~/.local/state/workstation"

[nix]
systems = ["x86_64-linux", "aarch64-darwin"]
state_version = "25.11"

[profiles]
names = ["workstation", "fresh"]
default = "workstation"
check = "workstation"
bootstrap = "fresh"

[profiles.workstation]
mode = "adopt"

[profiles.fresh]
mode = "fresh"

[components]
order = ["shell", "example-term", "example-app"]

[components.shell]
enable = true

[components.example-term]
enable = true
profiles = ["workstation"]

[components.example-app]
enable = true

[skills]
hm_root = ".codex/skills"

[agent_rules]
source = "agent/AGENTS.md"

[compat]
legacy_env = true
