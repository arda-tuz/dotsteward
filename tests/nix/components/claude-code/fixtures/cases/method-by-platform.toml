# deb on Linux and external on darwin through method_by_platform.
schema_version = 1

[identity]
username = "alice"

[instance]
remote = "git@github.com:alice/workstation.git"

[nix]
systems = ["x86_64-linux", "aarch64-darwin"]
state_version = "25.11"

[profiles]
names = ["workstation"]

[components.claude-code]
enable = true
method_by_platform = { linux = "deb", darwin = "external" }
