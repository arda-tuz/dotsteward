# The deb method on darwin, which claude-code does not support there.
schema_version = 1

[identity]
username = "alice"

[instance]
remote = "git@github.com:alice/workstation.git"

[nix]
systems = ["x86_64-linux", "aarch64-darwin"]
state_version = "25.11"

[profiles]
names = ["workstation"]

[components.claude-code]
enable = true
method = "deb"
