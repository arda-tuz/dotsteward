# method external on both platforms: VS Code installed by the user.
schema_version = 1

[identity]
username = "alice"

[instance]
remote = "git@github.com:alice/workstation.git"

[nix]
systems = ["x86_64-linux", "aarch64-darwin"]
state_version = "25.11"

[profiles]
names = ["workstation", "fresh"]
default = "workstation"
check = "workstation"
bootstrap = "fresh"

[profiles.workstation]
mode = "adopt"

[profiles.fresh]
mode = "fresh"

[components.vscode]
enable = true
method = "external"
options = { set_default_editor = true }
