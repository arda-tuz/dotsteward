# A Linux instance with the five catalog components that install a vendor DEB
# published as a GitHub release asset. Tests call lib.mkInstance with
# constructed inputs; the cases in ../cases replace this file.
schema_version = 1

[identity]
username = "alice"

[instance]
remote = "git@github.com:alice/workstation.git"

[nix]
systems = ["x86_64-linux"]
state_version = "25.11"

[profiles]
names = ["workstation", "fresh"]
default = "workstation"
check = "workstation"
bootstrap = "fresh"

[profiles.workstation]
mode = "adopt"

[profiles.fresh]
mode = "fresh"

[components.pdfcraft]
enable = true

[components.gridcraft]
enable = true

[components.wordcraft]
enable = true

[components.deckcraft]
enable = true

[components.craft-anything]
enable = true
