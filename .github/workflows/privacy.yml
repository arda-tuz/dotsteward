name: privacy

# generic: the generic rules on the commits an event brings (with the commit
# rules) and on the tree of their tip. denylist: the private denylist on the
# whole history and the tree; it runs only for a push to main and for a
# manual dispatch (maintainers only), never for a pull request, so no fork
# ever reaches the secret. Findings are always redacted.

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to scan (also with the denylist)
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  generic:
    # A branch deletion has no commits to scan.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the commits
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PUSHED_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          tip=$(git rev-parse HEAD)
          case $EVENT in
            pull_request)
              range="$PR_BASE..$tip"
              ;;
            push)
              if [[ $BEFORE =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                # A new branch, or a previous tip that is gone: the commits
                # that the default branch of origin does not have. Other
                # branches are not excluded: branches pushed together would
                # exclude each other, and their shared commits would never
                # be scanned.
                range=$tip
                if [[ ${PUSHED_REF#refs/heads/} != "$DEFAULT_BRANCH" ]] &&
                  git rev-parse -q --verify "refs/remotes/origin/$DEFAULT_BRANCH^{commit}" >/dev/null; then
                  range+=" ^refs/remotes/origin/$DEFAULT_BRANCH"
                fi
              else
                range="$BEFORE..$tip"
              fi
              ;;
            *)
              # A dispatch: the whole history of the requested ref.
              range=$tip
              ;;
          esac
          cli/commands/scan.sh --range "$range" --metadata --redact
      - name: Scan the tree
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: cli/commands/scan.sh --tree --redact

  denylist:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the history and the tree with the denylist
        env:
          DOTSTEWARD_DENYLIST: ${{ secrets.DOTSTEWARD_DENYLIST }}
        run: |
          # The denylist lives only in a private temporary file outside the
          # work tree; it is never printed and removed when the step ends.
          umask 077
          denylist=$(mktemp "$RUNNER_TEMP/denylist.XXXXXX")
          trap 'rm -f -- "$denylist"' EXIT
          printf '%s\n' "$DOTSTEWARD_DENYLIST" >"$denylist"
          unset DOTSTEWARD_DENYLIST
          status=0
          cli/commands/scan.sh --range "$(git rev-parse HEAD)" --metadata \
            --denylist "$denylist" --require-denylist --redact || status=1
          cli/commands/scan.sh --tree \
            --denylist "$denylist" --require-denylist --redact || status=1
          exit "$status"
