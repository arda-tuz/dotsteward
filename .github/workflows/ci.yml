name: ci

# lint runs on every event. The full check (`nix flake check`) runs on
# every push to main, nightly and on a manual dispatch, and for pull requests
# from forks; pull requests and branch pushes of this repository run only
# lint and the privacy scans (privacy.yml). `dotsteward contribute publish`
# waits for lint and the privacy scans of the pull request head, and
# `dotsteward contribute release` releases only a main commit whose push
# runs of this workflow and privacy.yml are green.

on:
  push:
    # Branches of the privacy drill (tests/ci/privacy-drill.sh) carry
    # deliberate leaks; only privacy.yml looks at them.
    branches-ignore:
      - "leak-test/**"
  pull_request:
  schedule:
    # Nightly, on the newest commit of main: drift of the locked inputs and
    # of the runner image shows before the next release.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded runs of a branch or pull request are cancelled. Every run on
  # main (a push, the nightly run or a dispatch) has a group of its own, so
  # none is cancelled or replaced by a newer pending one: the release reads
  # the result of exactly its commit.
  group: ci-${{ github.ref == 'refs/heads/main' && format('main-{0}-{1}', github.event_name, github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Authenticated GitHub fetches of the locked flake inputs.
      NIX_CONFIG: access-tokens = github.com=${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        run: bash tests/ci/install-nix.sh
      # One shellcheck per CPU, 50 files each. -x follows the sourced files
      # (named by their `# shellcheck source=` directives) in every batch,
      # as one shellcheck over all files does for the files it was given.
      - name: shellcheck (pinned by flake.lock, in parallel)
        run: |
          git ls-files -z -- '*.sh' cli/dotsteward .githooks/pre-push .githooks/commit-msg .githooks/pre-commit |
            nix shell --inputs-from . nixpkgs#shellcheck --command xargs -0 -r -P "$(nproc)" -n 50 shellcheck -x --
      - name: actionlint (pinned by flake.lock)
        run: nix shell --inputs-from . nixpkgs#actionlint nixpkgs#shellcheck --command actionlint
      # Fakes for QEMU and SSH: it never boots a virtual machine.
      - name: VM harness self-test
        run: bash tests/vm/selftest.sh
      - name: Python syntax
        run: |
          dirs=()
          for dir in cli/python engines; do
            [[ ! -d $dir ]] || dirs+=("$dir")
          done
          if ((${#dirs[@]})); then
            find "${dirs[@]}" -name '*.py' -print0 | xargs -0 -r python3 -m py_compile
          else
            echo "no Python sources yet"
          fi

  check:
    # The full check: main (push, nightly, dispatch) and pull requests from
    # forks, whose changes no framework gate of this repository has seen. A
    # job skipped here reports success, so the required check stays
    # satisfiable on pull requests of this repository.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NIX_CONFIG: access-tokens = github.com=${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        run: bash tests/ci/install-nix.sh
      # Every check runs as many test files at once as its build has cores,
      # so the runner's 4 vCPUs take 2 builds of 2 cores: Nix's defaults
      # (one build per vCPU, every vCPU each) would run 16 files at once.
      - name: nix flake check
        run: nix flake check -L --max-jobs 2 --cores 2
      # The suites that need the host: the pre-push hook (a writable bare
      # remote), real Nix (tests/host) and the channel installer's
      # stand-ins (tests/channels). One file at a time: a test of
      # tests/host drives real Nix, whose evaluation and builds use every
      # vCPU.
      - name: Host-level tests (outside the sandbox)
        run: bash tests/run.sh --jobs 1 tests/hooks tests/host tests/channels
