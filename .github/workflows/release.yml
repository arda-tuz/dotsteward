name: release

# Cuts the pending release of main (release trains): `tools/version.sh
# release`, with the rules of cli/lib/release.sh. A release is pending when
# VERSION of the commit is the next release after the newest tag, which a
# release commit (`tools/version.sh bump`) sets; the release bundles every
# commit since the last one. It runs once ci.yml passed on main (a push,
# the nightly run or a dispatch), so a release commit is released as soon
# as its full check is green, and on demand. It makes no commit: the release
# commit went through the framework gate and CI like any other, so the tag
# names a commit whose CI is green. A major release needs the major input
# of a dispatch.

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      major:
        description: Allow a major release (a breaking change, only by a decision of the user)
        type: boolean
        default: false

permissions:
  # The tag and the GitHub release, and the dispatch of channels.yml on the
  # tag (a tag made with this token starts no workflow by itself).
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    # A dispatch on main, or a ci run on main of this repository that
    # passed; never a pull request (a fork's branch may be called main).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Cut the pending release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          MAJOR: ${{ inputs.major }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --rev "$COMMIT")
          [[ $MAJOR != true ]] || args+=(--major)
          bash tools/version.sh release "${args[@]}"
