# What differs on Ubuntu 22.04 (jammy): docs/platforms.md#platform-files.
# Measured for the framework: glibc 2.35, apt 2.4, python3-apt 2.4, Python 3.10. The
# pins of the kernel and driver classes have the same form as on 24.04, and vendor
# repositories with a code name take {codename} = jammy. The preflight of stage 0 is
# tested on 22.04 (tests/container); a whole install is not yet, so the release takes the
# adaptive route until you declare it here by removing the comment signs:
schema_version = 1

